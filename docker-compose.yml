name: erp-vendas

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_SENHA:-Erp@Vendas2026}
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      retries: 12
      start_period: 20s

  api:
    build: .
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ConnectionStrings__SqlServer: Server=sqlserver,1433;Database=ErpVendas;User Id=sa;Password=${SA_SENHA:-Erp@Vendas2026};TrustServerCertificate=True
      Seed__DadosIniciais: "true"
    ports:
      - "5090:8080"
